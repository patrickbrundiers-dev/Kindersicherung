# Nur Werkzeug-Einstellungen; die Integration selbst wird über HACS installiert.

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "W",    # Leerzeichen
    "B",    # typische Fehler (bugbear)
    "UP",   # moderne Python-Syntax
    "SIM",  # Vereinfachungen
    "ASYNC",
]
ignore = [
    "E501", # Zeilenlänge regelt der Formatter
]
